<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="小庙">
  <defs>
    <linearGradient id="orb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="1" stop-color="#FFDFBC"/>
    </linearGradient>
    <linearGradient id="orb-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE58F"/>
      <stop offset="0.45" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#E07F1F"/>
    </linearGradient>
    <linearGradient id="orb-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8069"/>
      <stop offset="1" stop-color="#DD3F37"/>
    </linearGradient>
    <linearGradient id="orb-column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD97E"/>
      <stop offset="0.5" stop-color="#E9A94A"/>
      <stop offset="1" stop-color="#C9852D"/>
    </linearGradient>
    <linearGradient id="orb-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E9"/>
      <stop offset="1" stop-color="#E3D3BE"/>
    </linearGradient>
    <linearGradient id="orb-lantern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A63"/>
      <stop offset="1" stop-color="#D82F2A"/>
    </linearGradient>
    <radialGradient id="orb-door-light" cx="0.5" cy="0.78" r="0.8">
      <stop offset="0" stop-color="#FFF8D2"/>
      <stop offset="0.55" stop-color="#FFD264"/>
      <stop offset="1" stop-color="#E8862B"/>
    </radialGradient>
    <clipPath id="orb-clip">
      <circle cx="48" cy="48" r="44"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="44" fill="url(#orb-sky)" stroke="#B8482F" stroke-width="2.6"/>

  <g clip-path="url(#orb-clip)">
    <!-- stone base: two steps so the temple stands -->
    <rect x="26" y="79.5" width="44" height="6" rx="2" fill="url(#orb-stone)" stroke="#8C3A2A" stroke-width="1.8"/>
    <rect x="29" y="73.5" width="38" height="6.4" rx="1.8" fill="url(#orb-stone)" stroke="#8C3A2A" stroke-width="1.8"/>
    <path d="M29.6 76.7h37" stroke="#C9B49B" stroke-width="0.9" opacity="0.65"/>

    <!-- wall: tall rectangle -->
    <rect x="31" y="38" width="34" height="35.5" rx="2.2" fill="url(#orb-wall)" stroke="#8C3A2A" stroke-width="2"/>
    <rect x="32.4" y="41.5" width="3.6" height="28" rx="1.8" fill="#FFFFFF" opacity="0.16"/>

    <!-- gold columns flanking the door, running up to the eave -->
    <rect x="34.6" y="42.4" width="4.2" height="31.1" rx="1.6" fill="url(#orb-column)" stroke="#8C3A2A" stroke-width="1.3"/>
    <rect x="57.2" y="42.4" width="4.2" height="31.1" rx="1.6" fill="url(#orb-column)" stroke="#8C3A2A" stroke-width="1.3"/>

    <!-- arched door with warm light -->
    <path d="M41 73.5V55a7 7 0 0 1 14 0v18.5Z" fill="#4A1F16" stroke="#8C3A2A" stroke-width="1.4"/>
    <path class="temple-door-light" d="M42.5 73.5V55.4a5.5 5.5 0 0 1 11 0v18.1Z" fill="url(#orb-door-light)"/>
    <path d="M48 49.6v23.9" stroke="#C98A3F" stroke-width="0.9" opacity="0.32"/>

    <!-- plaque over the door -->
    <rect x="41" y="42" width="14" height="5.4" rx="1.4" fill="#F5C455" stroke="#6B3410" stroke-width="1.2"/>
    <path d="M43.4 44.7h9.2" stroke="#8C5A2B" stroke-width="0.9" opacity="0.55"/>

    <!-- upper roof (back tier) -->
    <path d="M28 14C34 18.5 42 20 48 20S62 18.5 68 14C64 24 58 30 48 32.5C38 30 32 24 28 14Z"
          fill="url(#orb-roof)" stroke="#8C3A2A" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M33.5 19.4c4.5-2.6 24.5-2.6 29 0" fill="none" stroke="#FFF1C4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- lower roof (front tier): flat centre, wings sweeping up at both ends -->
    <path d="M16 24C24 30 36 31 48 31S72 30 80 24C75 33 67 38.5 57 40.2C54 40.6 51 40.8 48 40.8C45 40.8 42 40.6 39 40.2C29 38.5 21 33 16 24Z"
          fill="url(#orb-roof)" stroke="#8C3A2A" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#B8482F" stroke-width="0.85" stroke-linecap="round" opacity="0.4" fill="none">
      <path d="M34 31.1V39.9"/>
      <path d="M40 31.25V40.4"/>
      <path d="M46 31.3V40.7"/>
      <path d="M50 31.3V40.7"/>
      <path d="M56 31.25V40.4"/>
      <path d="M62 31.1V39.9"/>
    </g>
    <path d="M25 34.6c6 3.4 14 5.2 23 5.4 9-.2 17-2 23-5.4" fill="none" stroke="#8C3A2A" stroke-width="1" opacity="0.26"/>

    <!-- lantern under the right eave -->
    <g class="temple-lantern">
      <path d="M72.5 33.5v4.5" stroke="#8C3A2A" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="70" y="37.6" width="5" height="2.4" rx="1.1" fill="#F2B33C" stroke="#8C3A2A" stroke-width="1.1"/>
      <ellipse cx="72.5" cy="44.6" rx="5.8" ry="7" fill="url(#orb-lantern)" stroke="#8C3A2A" stroke-width="1.5"/>
      <rect x="70" y="50.6" width="5" height="2.4" rx="1.1" fill="#F2B33C" stroke="#8C3A2A" stroke-width="1.1"/>
      <path d="M72.5 53v3.2" stroke="#E5453C" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="72.5" cy="57.2" r="1.2" fill="#E5453C"/>
    </g>
  </g>

  <circle cx="48" cy="48" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.55"/>
</svg>
