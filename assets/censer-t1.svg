<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112" width="96" height="112" role="img" aria-label="陶土香炉">
  <defs>
    <linearGradient id="clay-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#C69E72"/>
      <stop offset="0.5" stop-color="#A98157"/>
      <stop offset="1" stop-color="#7E5C3C"/>
    </linearGradient>
    <linearGradient id="clay-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B48A60"/>
      <stop offset="1" stop-color="#8A6744"/>
    </linearGradient>
    <linearGradient id="incense-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D2554A"/>
      <stop offset="0.5" stop-color="#B3352B"/>
      <stop offset="1" stop-color="#7E1F18"/>
    </linearGradient>
    <radialGradient id="censer-flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#FFD264" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFC24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle class="censer-flare" cx="48" cy="46" r="30" fill="url(#censer-flare)" opacity="0"/>

  <!-- 三根普通细香 -->
  <g class="censer-stick">
    <rect x="42.4" y="30" width="2.2" height="36" rx="1.1" fill="url(#incense-red)"/>
    <rect x="46.9" y="26" width="2.2" height="40" rx="1.1" fill="url(#incense-red)"/>
    <rect x="51.4" y="30" width="2.2" height="36" rx="1.1" fill="url(#incense-red)"/>
    <ellipse class="censer-ember" cx="43.5" cy="29.4" rx="1.7" ry="1.5" fill="#FF9E5A"/>
    <ellipse class="censer-ember" cx="48" cy="25.4" rx="1.7" ry="1.5" fill="#FF9E5A"/>
    <ellipse class="censer-ember" cx="52.5" cy="29.4" rx="1.7" ry="1.5" fill="#FF9E5A"/>
  </g>

  <!-- 粗陶小圆炉 -->
  <path d="M16 64c0 13 14 24 32 24s32-11 32-24z" fill="url(#clay-body)" stroke="#6E5033" stroke-width="2" stroke-linejoin="round"/>
  <path d="M22 70c3 9 12 15 26 15" fill="none" stroke="#E0BE95" stroke-width="2" opacity="0.28" stroke-linecap="round"/>
  <ellipse cx="48" cy="64" rx="32" ry="7" fill="url(#clay-rim)" stroke="#6E5033" stroke-width="2"/>
  <ellipse cx="48" cy="63.4" rx="25" ry="4.6" fill="#5B4028" opacity="0.85"/>
  <ellipse cx="48" cy="90" rx="17" ry="3.6" fill="#6E5033" opacity="0.45"/>

  <g class="censer-smoke" fill="none" stroke="#C6C6C6" stroke-width="1.4" stroke-linecap="round" opacity="0">
    <path d="M48 22c-4-6 4-10 0-16"/>
  </g>
</svg>
